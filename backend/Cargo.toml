[package]
name = "web3_wallet_service"
version = "0.3.0"
edition = "2021"
description = "A modular Web3 wallet management service with multi-chain support"
authors = ["robust"]

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
# IP-based rate limiting (governor pattern). Used to throttle /auth/login
# bruteforce and to provide a global per-IP cap.
actix-governor = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "chrono", "rust_decimal"] }

# Blockchain
ethers = { version = "2", features = ["abigen", "ws"] }

# HTTP client with proxy support
reqwest = { version = "0.11", features = ["json", "socks"] }
url = "2"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# JWT
jsonwebtoken = "9"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rolling-file = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time & decimal
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Futures
futures = "0.3"

# Hex encoding
hex = "0.4"

# Base64 encoding
base64 = "0.21"

# Base58 encoding (for Zcash/Bitcoin addresses)
bs58 = "0.5"

# SHA256/RIPEMD160 for address generation
sha2 = "0.10"
ripemd = "0.1"

# BLAKE2b for Zcash transaction hashing (ZIP 244)
blake2b_simd = "1.0"

# Zcash transaction primitives for proper sighash calculation
# Upgraded as a group 2026-07-24 (F4.0): NU6.3 (Ironwood) needs orchard 0.15
# (rcm_v3 / ZIP-2005, PostNu6_3 circuit keys, Ironwood v6 bundles). Versions
# anchored to zebra v6.2.1's dependency stack; exact patch versions come from
# the transitive resolution in Cargo.lock, not hand-pinned here.
# `non-standard-fees` exposes `transaction::fees::fixed::FeeRule`, used by the
# turnstile builder to force the exact fee the proposal computed (rather than
# have ZIP-317 recompute a possibly-different figure).
zcash_primitives = { version = "0.29", features = ["non-standard-fees"] }
zcash_protocol = "0.10"

# Zcash Orchard privacy protocol support (Orchard + Ironwood pools)
orchard = "0.15"
zcash_note_encryption = "0.4"
zcash_address = "0.13"
# Direct deps for the NU6.3/Ironwood turnstile build path (F4.0-c P1.2). The
# zcash_primitives transaction Builder handles v6 serialization, sighash_v6,
# proving and the cross-pool value balance for the turnstile (orchard_v3 spend +
# ironwood_v3 output), so we don't hand-roll consensus-critical bytes.
# - `sapling` (sapling-crypto) is needed to name the SpendProver/OutputProver
#   traits `Builder::build` requires; the turnstile carries no Sapling bundle, so
#   we pass a fail-loud placeholder prover (panics if ever invoked).
# - `zcash_transparent` provides `TransparentSigningSet` (empty for a pure
#   shielded turnstile). Versions match zcash_primitives 0.29's own resolution.
sapling = { package = "sapling-crypto", version = "0.7" }
zcash_transparent = "0.9"
# Named only to spell the SpendProver/OutputProver trait signatures on the
# fail-loud placeholder (scalar param types). Versions match sapling-crypto 0.7.
jubjub = "0.10"
bls12_381 = "0.8"
# zip32 was extracted out of zcash_primitives starting with 0.27
zip32 = "0.2"
pasta_curves = { version = "0.5", features = ["bits"] }
incrementalmerkletree = { version = "0.8", features = ["legacy-api"] }
subtle = "2.5"

# secp256k1 for key operations
secp256k1 = { version = "0.28", features = ["rand"] }

# Lazy static initialization
once_cell = "1.19"

# F1.1 disclosure export — CSV table writer (zero-config) + PDF generator
# for offline audit archive (printpdf is pure-Rust, no system deps).
csv = "1.3"
printpdf = "0.7"

[dev-dependencies]
actix-rt = "2"
dotenv = "0.15"

[[example]]
name = "backup_wallets"
path = "examples/backup_wallets.rs"
